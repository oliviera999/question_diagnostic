# Intégration continue de local_question_diagnostic.
# Moodle 5.1, 5.2 et 5.3 (production : 5.3), PHP 8.2 à 8.4, PostgreSQL 17 et MariaDB 11.4.
name: Moodle Plugin CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'true'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - {moodle-branch: 'MOODLE_501_STABLE', php: '8.2', database: 'pgsql'}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.3', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_503_STABLE', php: '8.3', database: 'pgsql'}
          - {moodle-branch: 'MOODLE_503_STABLE', php: '8.3', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_503_STABLE', php: '8.4', database: 'pgsql'}

    steps:
      - name: Récupération du plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialisation de moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Installation de Moodle et du plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: Syntaxe PHP
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Validation du plugin
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Points de sauvegarde
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Tests PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      # Le code antérieur à 1.15.0 ne suit pas encore les règles de codage de Moodle : ces contrôles sont
      # informatifs (dette suivie dans docs/), les étapes ci-dessus sont bloquantes.
      - name: Règles de codage (informatif)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: moodle-plugin-ci codechecker

      - name: PHPDoc (informatif)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: moodle-plugin-ci phpdoc

      - name: Tâches annulées en échec
        if: ${{ cancelled() }}
        run: exit 1
